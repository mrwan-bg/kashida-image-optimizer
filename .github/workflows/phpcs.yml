
name: WordPress Coding Standards

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpcs:
    name: Check WordPress Coding Standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: composer
          coverage: none

      - name: Create temporary PHPCS environment
        run: |
          mkdir phpcs-check
          cd phpcs-check
          composer init --no-interaction --name=kashida/phpcs-check
          composer require --no-interaction --with-all-dependencies \
            squizlabs/php_codesniffer:^3.10 \
            wp-coding-standards/wpcs:^3.1

      - name: Run WordPress Coding Standards
        run: |
          ./phpcs-check/vendor/bin/phpcs \
            --standard=WordPress \
            --extensions=php \
            kashida-image-optimizer/
