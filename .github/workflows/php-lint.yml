
name: PHP Syntax Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    name: Check PHP Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(
            find kashida-image-optimizer \
              -type f -name '*.php' -print0
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found."
            exit 1
          fi

          for file in "${files[@]}"; do
            echo "Checking: $file"
            php -l "$file"
          done
